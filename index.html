<script>
(()=>{
'use strict';
const KEY='daybook.prototype.v1', V=1, FLOOR=1000;
const ACT=[
 {v:1.4,n:'mostly still',d:'Most of the day sitting; little intentional movement.'},
 {v:1.6,n:'lightly moving',d:'Mostly seated with some walking or moderate activity.'},
 {v:1.8,n:'regularly active',d:'A fair amount of walking, standing, training, or active work.'},
 {v:2.0,n:'very active',d:'Active work, frequent training, or a lot of daily movement.'},
 {v:2.2,n:'exceptionally active',d:'High-volume training or a physically demanding routine.'}
];
const PERIODS=['breakfast','lunch','dinner','snacks'];
const PERIOD_LABEL={breakfast:'breakfast',lunch:'lunch',dinner:'dinner',snacks:'snacks'};
const FDA_DV={fatG:78,saturatedFatG:20,sodiumMg:2300,addedSugarG:50,fiberG:28,carbsG:275,proteinG:50};
const DEFAULT_MACRO_SPLIT={protein:25,carbs:45,fat:30};
const DETAIL_FIELDS=[['saturatedFatG','saturated fat'],['transFatG','trans fat'],['addedSugarG','added sugar'],['sodiumMg','sodium']];
const BACKFILL_FIELDS=['fiberG','sugarG','addedSugarG','saturatedFatG','transFatG','sodiumMg'];
const fresh=()=>({schemaVersion:V,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),profile:{onboardingComplete:false,units:'imperial',age:null,sexForEquation:null,pregnantBreastfeeding:false,heightIn:null,weightLb:null,activityPAL:1.6,goalType:'lose',goalWeightLb:null,rateLbWeek:1,paceMode:'steady',manualDailyGuide:null,nutritionPlanMode:'auto',customNutritionTargets:null,macroSplit:{...DEFAULT_MACRO_SPLIT}},foods:[],entries:[],weights:[],prefs:{date:iso()}});
function periodId(v){return ({morning:'breakfast',midday:'lunch',evening:'dinner',other:'snacks',breakfast:'breakfast',lunch:'lunch',dinner:'dinner',snack:'snacks',snacks:'snacks'})[String(v||'').toLowerCase()]||'snacks'}
let state=load(),view='day',step=0,draft=null,selectedFood=null,editFoodId=null,editEntryId=null,aiPreview=null,timer=null,paceTouched=false;
function iso(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${x}`}
function parseDate(s){const [y,m,d]=String(s).split('-').map(Number);return new Date(y,m-1,d,12)}
function shift(s,n){const d=parseDate(s);d.setDate(d.getDate()+n);return iso(d)}
function hdate(s){return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'short',day:'numeric'}).format(parseDate(s))}
function sdate(s){return new Intl.DateTimeFormat(undefined,{month:'short',day:'numeric',year:'numeric'}).format(parseDate(s))}
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function n(v,f=0){const x=Number(v);return Number.isFinite(x)?x:f}function nn(v){if(v===''||v==null)return null;const x=Number(v);return Number.isFinite(x)?x:null}function rnd(v,d=0){const p=10**d;return Math.round((Number(v)+Number.EPSILON)*p)/p}function clamp(v,a,b){return Math.min(b,Math.max(a,v))}function fmt(v,d=0){return Number.isFinite(Number(v))?new Intl.NumberFormat(undefined,{maximumFractionDigits:d}).format(Number(v)):'-'}
function lbkg(x){return x/2.2046226218}function kglb(x){return x*2.2046226218}function incm(x){return x*2.54}function cmin(x){return x/2.54}
function uid(p){return p+'_'+(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2))}
function migrateSaved(x){
 const base=fresh();
 const prefsSource=x?.prefs||x?.preferences||{};
 const merged=Object.assign(base,x||{}, {profile:Object.assign(fresh().profile,x?.profile||{}),prefs:Object.assign(fresh().prefs,prefsSource),foods:Array.isArray(x?.foods)?x.foods:[],entries:Array.isArray(x?.entries)?x.entries:[],weights:Array.isArray(x?.weights)?x.weights:[]});
 const split=merged.profile.macroSplit||DEFAULT_MACRO_SPLIT;
 merged.profile.macroSplit={protein:n(split.protein,25),carbs:n(split.carbs,45),fat:n(split.fat,30)};
 merged.profile.nutritionPlanMode=['auto','custom'].includes(merged.profile.nutritionPlanMode)?merged.profile.nutritionPlanMode:'auto';
 merged.profile.customNutritionTargets=merged.profile.customNutritionTargets&&typeof merged.profile.customNutritionTargets==='object'?merged.profile.customNutritionTargets:null;
 merged.foods=merged.foods.map(f=>({...f,nutrition:normNut(f.nutrition||{})}));
 merged.entries=merged.entries.map(e=>({...e,period:periodId(e.period),nutritionSnapshot:normNut(e.nutritionSnapshot||{})}));
 backfillEntriesFromLibrary(merged.foods,merged.entries);
 return merged;
}
function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return fresh();const x=JSON.parse(raw);return x&&x.schemaVersion===V?migrateSaved(x):fresh()}catch(e){return fresh()}}
function save(r=false){state.updatedAt=new Date().toISOString();localStorage.setItem(KEY,JSON.stringify(state));if(r)render()}
function toast(s){const e=document.getElementById('toast');e.textContent=s;e.classList.add('show');clearTimeout(timer);timer=setTimeout(()=>e.classList.remove('show'),2000)}
async function copy(s,msg='copied'){try{await navigator.clipboard.writeText(s)}catch(e){const t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove()}toast(msg)}
function bmi(w,h){if(!w||!h)return null;const kg=lbkg(w),m=incm(h)/100;return kg/(m*m)}
function rmr(p,wOverride=null){const age=n(p.age,NaN),w=n(wOverride??p.weightLb,NaN),h=n(p.heightIn,NaN),sex=p.sexForEquation;if(!Number.isFinite(age)||!Number.isFinite(w)||!Number.isFinite(h)||!['male','female'].includes(sex))return null;return 10*lbkg(w)+6.25*incm(h)-5*age+(sex==='male'?5:-161)}
function maintenance(p,wOverride=null){const r=rmr(p,wOverride);return r? r*n(p.activityPAL,1.6):null}
function guidance(p=state.profile){const out={ok:false,reason:null,rmr:null,maint:null,target:null,raw:null,rate:n(p.rateLbWeek),weeks:null,date:null,floor:false,goalBmi:null};if(n(p.age)<18){out.reason='Automatic guidance is only provided for adults in this prototype.';return out}if(p.pregnantBreastfeeding){out.reason='Automatic guidance is not provided during pregnancy or breastfeeding.';return out}const r=rmr(p);if(!r){out.reason='There is not enough information to calculate an automatic guide.';return out}out.rmr=r;out.maint=maintenance(p);if(p.goalWeightLb)out.goalBmi=bmi(p.goalWeightLb,p.heightIn);if(p.goalType==='lose'&&n(p.age)>=20&&out.goalBmi&&out.goalBmi<18.5){out.reason='That destination falls below the adult BMI screening threshold of 18.5, so this prototype will not generate a weight-loss target for it.';return out}let deficit=0;if(p.goalType==='lose')deficit=out.rate*500;if(p.goalType==='gain')deficit=-out.rate*500;out.raw=out.maint-deficit;out.target=Math.max(FLOOR,out.raw);out.floor=out.raw<FLOOR;const current=n(p.weightLb),goal=n(p.goalWeightLb),effectiveRate=p.goalType==='maintain'?0:Math.max(0,(out.maint-out.target)*7/3500);if(goal&&current&&effectiveRate>0){out.weeks=Math.abs(current-goal)/effectiveRate;const d=new Date();d.setDate(d.getDate()+Math.round(out.weeks*7));out.date=iso(d)}out.ok=true;return out}
function paceOptions(p=draft){const current=n(p.weightLb),goal=n(p.goalWeightLb);if(!current||!goal||p.goalType==='maintain')return [];
 const modes=p.goalType==='lose'?[{id:'slow',name:'Slow',note:'Easier to sustain',rate:.5,rec:false},{id:'steady',name:'Steady',note:'Balanced starting point',rate:1,rec:true},{id:'fast',name:'Faster',note:'More aggressive',rate:1.5,rec:false}]:[{id:'slow',name:'Slow',note:'Small surplus',rate:.25,rec:false},{id:'steady',name:'Steady',note:'Balanced starting point',rate:.5,rec:true},{id:'fast',name:'Faster',note:'Larger surplus',rate:1,rec:false}];
 const m=maintenance(p);if(!m)return [];
 return modes.map(o=>{let raw=p.goalType==='lose'?m-o.rate*500:m+o.rate*500;let target=Math.max(FLOOR,raw);let effective=p.goalType==='lose'?Math.max(0,(m-target)*7/3500):Math.max(0,(target-m)*7/3500);let weeks=effective?Math.abs(current-goal)/effective:null;let date=null;if(weeks){const d=new Date();d.setDate(d.getDate()+Math.round(weeks*7));date=iso(d)}return {...o,target:rnd(target),raw,rate:effective||o.rate,weeks,date,limited:raw<FLOOR};});
}
function suggestedMode(p=draft){const opts=paceOptions(p);if(!opts.length)return null;const steady=opts.find(x=>x.id==='steady'&&!x.limited);if(steady)return steady.id;const slow=opts.find(x=>x.id==='slow'&&!x.limited);if(slow)return slow.id;return opts[0].id}
function todayWeight(){const w=[...state.weights].sort((a,b)=>b.date.localeCompare(a.date))[0];return w?n(w.weightLb):nn(state.profile.weightLb)}
function blankNut(){return {calories:0,proteinG:0,carbsG:0,fatG:0,fiberG:null,sugarG:null,addedSugarG:null,saturatedFatG:null,transFatG:null,sodiumMg:null}}
function optNum(v){return v==null||v===''?null:Math.max(0,n(v))}
function normNut(x={}){return {calories:Math.max(0,n(x.calories)),proteinG:Math.max(0,n(x.proteinG)),carbsG:Math.max(0,n(x.carbsG)),fatG:Math.max(0,n(x.fatG)),fiberG:optNum(x.fiberG),sugarG:optNum(x.sugarG),addedSugarG:optNum(x.addedSugarG),saturatedFatG:optNum(x.saturatedFatG??x.satFatG),transFatG:optNum(x.transFatG),sodiumMg:optNum(x.sodiumMg)}}
function normFood(f={}){const now=new Date().toISOString();return {id:f.id||uid('food'),name:String(f.name||'Untitled item').trim()||'Untitled item',brand:f.brand?String(f.brand).trim():null,serving:{amount:Math.max(.0001,n(f.serving?.amount,1)),unit:String(f.serving?.unit||'serving'),description:String(f.serving?.description||'1 serving')},nutrition:normNut(f.nutrition||{}),sourceType:['user','label','restaurant','estimate'].includes(f.sourceType)?f.sourceType:'estimate',confidence:['high','medium','low'].includes(f.confidence)?f.confidence:'medium',notes:f.notes?String(f.notes):null,createdAt:f.createdAt||now,updatedAt:now}}
function food(id){return state.foods.find(x=>x.id===id)||null}
function backfillEntriesFromLibrary(foods,entries,onlyFoodId=null){let changedEntries=0,changedFields=0;const byId=new Map((foods||[]).map(f=>[f.id,f]));for(const e of (entries||[])){if(onlyFoodId&&e.foodId!==onlyFoodId)continue;const f=byId.get(e.foodId);if(!f)continue;const snap=normNut(e.nutritionSnapshot||{}),src=normNut(f.nutrition||{});let changed=false;for(const k of BACKFILL_FIELDS){if(snap[k]==null&&src[k]!=null){snap[k]=src[k];changed=true;changedFields++}}if(changed){e.nutritionSnapshot=snap;e.updatedAt=new Date().toISOString();changedEntries++}}return {changedEntries,changedFields}}
function upsert(f){const existingIndex=f?.id?state.foods.findIndex(y=>y.id===f.id):-1,old=existingIndex>=0?state.foods[existingIndex]:null;const merged=old?{...old,...f,serving:{...old.serving,...(f.serving||{})},nutrition:{...old.nutrition,...(f.nutrition||{})}}:f;const x=normFood(merged);if(existingIndex>=0){x.createdAt=old.createdAt;state.foods[existingIndex]=x}else state.foods.push(x);backfillEntriesFromLibrary(state.foods,state.entries,x.id);return x}
function entryNut(e){const q=n(e.servings,1),x=normNut(e.nutritionSnapshot),o={};for(const k of Object.keys(blankNut()))o[k]=x[k]==null?null:x[k]*q;return o}
function sumNuts(items){const keys=Object.keys(blankNut()),out=blankNut(),seen={};for(const k of keys){out[k]=0;seen[k]=false}for(const item of items){const x=normNut(item);for(const k of keys){if(x[k]!=null){out[k]+=x[k];seen[k]=true}}}for(const k of keys)if(!seen[k])out[k]=null;out.calories=out.calories||0;out.proteinG=out.proteinG||0;out.carbsG=out.carbsG||0;out.fatG=out.fatG||0;return out}
function totals(date,excludeId=null){return sumNuts(state.entries.filter(e=>e.date===date&&e.id!==excludeId).map(entryNut))}
function mealTotals(date,period,excludeId=null){return sumNuts(state.entries.filter(e=>e.date===date&&periodId(e.period)===periodId(period)&&e.id!==excludeId).map(entryNut))}
function mkEntry(f,date,period='snacks',servings=1,existing=null){return {id:existing||uid('entry'),foodId:f.id,date,period:periodId(period),servings:Math.max(.01,n(servings,1)),nameSnapshot:f.name,brandSnapshot:f.brand,servingSnapshot:{...f.serving},nutritionSnapshot:{...f.nutrition},createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()}}
function automaticNutritionTargets(g=dailyGuide(),p=state.profile){if(!g)return null;let current=n(p.weightLb||0),goal=n(p.goalWeightLb||0);if(!current&&p===state.profile)current=n(todayWeight());const currentKg=current?lbkg(current):0,goalKg=goal?lbkg(goal):0;let proteinG=g*.27/4,proteinBasis='balanced starting estimate';if(p.goalType==='lose'&&currentKg){const currentFloor=currentKg*1.3,goalHigh=goalKg?goalKg*1.6:currentKg*1.4;proteinG=Math.max(currentFloor,goalHigh);proteinBasis=goalKg?'higher of 1.3 g/kg current or 1.6 g/kg destination':'1.4 g/kg current'}else if(p.goalType==='gain'&&currentKg){proteinG=currentKg*1.6;proteinBasis='1.6 g/kg current'}else if(currentKg){proteinG=currentKg*1.4;proteinBasis='1.4 g/kg current'}proteinG=Math.min(proteinG,g*.35/4);const fatG=g*.30/9,carbsG=Math.max(0,(g-proteinG*4-fatG*9)/4);return {mode:'auto',proteinG,carbsG,fatG,fiberG:g/2000*FDA_DV.fiberG,saturatedFatG:g*.10/9,sodiumMg:2300,addedSugarMealG:10,proteinBasis,referenceWeightLb:goal||current}}
function nutritionTargets(g=dailyGuide(),p=state.profile){const a=automaticNutritionTargets(g,p);if(!a)return null;if(p.nutritionPlanMode==='custom'&&p.customNutritionTargets){const c=p.customNutritionTargets;return {...a,mode:'custom',proteinG:Math.max(0,n(c.proteinG,a.proteinG)),carbsG:Math.max(0,n(c.carbsG,a.carbsG)),fatG:Math.max(0,n(c.fatG,a.fatG)),fiberG:Math.max(0,n(c.fiberG,a.fiberG))}}return a}
function macroTargets(g=dailyGuide(),p=state.profile){return nutritionTargets(g,p)}
function macroSplit(g=dailyGuide(),p=state.profile){const mt=nutritionTargets(g,p);if(mt&&g){return {protein:mt.proteinG*4/g*100,carbs:mt.carbsG*4/g*100,fat:mt.fatG*9/g*100}}const s=p.macroSplit||DEFAULT_MACRO_SPLIT,total=n(s.protein)+n(s.carbs)+n(s.fat);return total>0?{protein:n(s.protein)/total*100,carbs:n(s.carbs)/total*100,fat:n(s.fat)/total*100}:{...DEFAULT_MACRO_SPLIT}}
function missingDetailForEntry(e){const x=normNut(e.nutritionSnapshot),missing=DETAIL_FIELDS.filter(([k])=>x[k]==null).map(([,label])=>label);return missing.length?{entry:e,missing}:null}
function nutrientCoverage(entries){const details=(entries||[]).map(missingDetailForEntry).filter(Boolean);return {missing:details.length,total:(entries||[]).length,details}}
function coverageNote(cov){if(!cov?.missing)return '';return cov.details.slice(0,3).map(d=>`${d.entry.nameSnapshot}: ${d.missing.join(', ')}`).join(' · ')+(cov.details.length>3?` · +${cov.details.length-3} more`:'')}
function itemFlags(x){x=normNut(x);const a=[];if(x.transFatG!=null&&x.transFatG>0)a.push({level:'bad',text:`trans fat ${fmt(x.transFatG,1)}g`});if(x.saturatedFatG!=null&&x.saturatedFatG>=FDA_DV.saturatedFatG*.2)a.push({level:'warn',text:'high saturated fat'});if(x.sodiumMg!=null&&x.sodiumMg>=FDA_DV.sodiumMg*.2)a.push({level:'warn',text:'high sodium'});if(x.addedSugarG!=null&&x.addedSugarG>=10)a.push({level:'warn',text:'10g+ added sugar'});return a}
function progressPct(value,target){return target?clamp(n(value)/target*100,0,100):0}
function remainingText(value,target,kind='guide'){if(!target)return '';const left=target-n(value);if(kind==='minimum')return left>0?`${fmt(left,1)} g to guide`:'guide met';return left>=0?`${fmt(left,1)} g left`:`${fmt(Math.abs(left),1)} g over guide`}
function goalCard(label,value,target,cls,kind='guide'){const known=value!=null,pct=known?progressPct(value,target):0;return `<div class="goalcard ${cls}"><div class="goallabel">${label}</div><div class="goalvalue">${known?fmt(value,1):'?'}<span>/ ${fmt(target,0)} g</span></div><div class="goalremain">${known?remainingText(value,target,kind):'unknown in logged items'}</div><div class="goaltrack"><div style="width:${pct}%"></div></div></div>`}
function detailCoverageCount(entries,key){let known=0,unknown=0;for(const e of entries){const x=normNut(e.nutritionSnapshot);if(x[key]==null)unknown++;else known++}return {known,unknown}}
function limitCell(label,value,target,entries,key,unit='g',mode='limit'){const coverage=detailCoverageCount(entries,key),known=value!=null;let valueText=known?`${fmt(value,unit==='mg'?0:1)} ${unit}`:'unknown';if(target&&known)valueText+=` / ${fmt(target,unit==='mg'?0:1)} ${unit}`;let baseNote=mode==='avoid'?'avoid reported trans fat':key==='addedSugarG'?'≤ 10 g added sugar per meal':'complete for logged entries';let note=coverage.unknown?`${coverage.unknown} ${coverage.unknown===1?'entry':'entries'} unknown · ${baseNote}`:baseNote;return `<div class="limitcell"><div class="limitlabel">${label}</div><div class="limitvalue">${valueText}</div><div class="limitnote">${note}</div></div>`}

function entryImpactHTML(x,period){x=normNut(x);const mt=nutritionTargets(),details=[];if(x.saturatedFatG!=null)details.push(`<span class="${mt&&x.saturatedFatG>=mt.saturatedFatG*.2?'attention':''}">sat fat ${fmt(x.saturatedFatG,1)}g${mt?` · ${fmt(x.saturatedFatG/mt.saturatedFatG*100)}% day`:''}</span>`);if(x.transFatG!=null)details.push(`<span class="${x.transFatG>0?'bad':''}">trans ${fmt(x.transFatG,1)}g${x.transFatG>0?' · flagged':''}</span>`);if(x.addedSugarG!=null)details.push(`<span class="${x.addedSugarG>=10?'attention':''}">added sugar ${fmt(x.addedSugarG,1)}g · ${fmt(x.addedSugarG/10*100)}% meal cap</span>`);else if(x.sugarG!=null)details.push(`<span>total sugar ${fmt(x.sugarG,1)}g</span>`);if(x.sodiumMg!=null)details.push(`<span class="${x.sodiumMg>=2300*.2?'attention':''}">sodium ${fmt(x.sodiumMg)}mg · ${fmt(x.sodiumMg/2300*100)}% day</span>`);return `<div class="entryimpact"><div class="impactgrid">${impactMetric('protein',x.proteinG,mt?.proteinG,'protein')}${impactMetric('carbs',x.carbsG,mt?.carbsG,'carbs')}${impactMetric('fat',x.fatG,mt?.fatG,'fat')}${impactMetric('fiber',x.fiberG,mt?.fiberG,'fiber')}</div>${details.length?`<div class="impactdetails">${details.join('')}</div>`:''}</div>`}

function aiprompt(req){const context={currentDate:iso(),selectedDate:state.prefs.date,profile:{...state.profile,weightLb:todayWeight(),dailyNutritionGuide:nutritionTargets()},library:state.foods,recentEntries:state.entries.filter(e=>e.date>=shift(state.prefs.date,-6)&&e.date<=state.prefs.date)};return `You are a structured data assistant for a private personal tracking app. Return ONLY valid JSON. No markdown or code fences.

IMPORTANT:
- Prefer an existing library food and exact food id when it clearly matches.
- Nutrition on a food always represents ONE serving. "servings" is the multiplier; do not pre-multiply nutrition.
- Do not delete anything.
- Preserve known user/label values unless the user asks to correct them.
- For upsertFood on an existing id, you may return only the fields you are changing; the app deep-merges serving and nutrition so omitted known fields are preserved.
- Unknown detailed nutrients MUST be null, not 0. Use 0 only when you are reasonably confident the nutrient is actually zero.
- sugarG means TOTAL sugar. addedSugarG means ADDED sugar only. Do not copy total sugar into added sugar.
- saturatedFatG, transFatG, addedSugarG, fiberG, sugarG, and sodiumMg are optional but useful because the app can surface nutrition notes from them.
- If a brand/product nutrition label or reliable published restaurant nutrition is known, prefer it. Otherwise make a reasonable estimate and mark sourceType/confidence accordingly.

MEALS:
"breakfast" | "lunch" | "dinner" | "snacks"
Map ordinary language like morning/breakfast -> breakfast, midday/lunch -> lunch, evening/supper/dinner -> dinner, snack/dessert/late-night -> snacks.

Allowed operations:
1) {"type":"upsertFood","food":{"id":"existing id only when updating","name":"string","brand":null,"serving":{"amount":1,"unit":"serving","description":"1 serving"},"nutrition":{"calories":0,"proteinG":0,"carbsG":0,"fatG":0,"fiberG":null,"sugarG":null,"addedSugarG":null,"saturatedFatG":null,"transFatG":null,"sodiumMg":null},"sourceType":"user|label|restaurant|estimate","confidence":"high|medium|low","notes":null}}
2) {"type":"addEntry","entry":{"date":"YYYY-MM-DD","period":"breakfast|lunch|dinner|snacks","servings":1,"foodId":"existing id"}} OR use "food" instead of "foodId" for a new food.
3) {"type":"addWeight","date":"YYYY-MM-DD","weightLb":180.5}
4) {"type":"updateProfile","changes":{"age":30,"heightIn":70,"weightLb":180,"activityPAL":1.6,"manualDailyGuide":null}}
5) {"type":"setGoal","goalType":"lose|maintain|gain","goalWeightLb":160,"rateLbWeek":1,"paceMode":"slow|steady|fast"}

Output shape: {"schemaVersion":1,"summary":"short summary","operations":[]}

CURRENT CONTEXT:
${JSON.stringify(context,null,2)}

USER REQUEST:
${req}

Return ONLY valid JSON.`}

window.applyAI=()=>{if(!aiPreview)return;let count=0,beforeMissing=nutrientCoverage(state.entries).missing;for(const o of aiPreview.operations){try{if(o.type==='upsertFood'){const f={...o.food};if(f.id&&!food(f.id))delete f.id;upsert(f);count++}else if(o.type==='addEntry'){let f=o.entry.foodId?food(o.entry.foodId):null;if(!f&&o.entry.food)f=upsert(o.entry.food);if(f){state.entries.push(mkEntry(f,o.entry.date||state.prefs.date,periodId(o.entry.period),n(o.entry.servings,1)));count++}}else if(o.type==='addWeight'){const w=n(o.weightLb);if(w>0){state.weights.push({id:uid('weight'),date:o.date||iso(),weightLb:w,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});state.profile.weightLb=w;count++}}else if(o.type==='updateProfile'){const allow=['units','age','sexForEquation','heightIn','weightLb','activityPAL','pregnantBreastfeeding','manualDailyGuide','nutritionPlanMode','customNutritionTargets'];for(const k of allow)if(k in (o.changes||{}))state.profile[k]=o.changes[k];count++}else if(o.type==='setGoal'){if(['lose','maintain','gain'].includes(o.goalType))state.profile.goalType=o.goalType;if(n(o.goalWeightLb)>0)state.profile.goalWeightLb=n(o.goalWeightLb);if(n(o.rateLbWeek)>=0)state.profile.rateLbWeek=n(o.rateLbWeek);if(['slow','steady','fast'].includes(o.paceMode))state.profile.paceMode=o.paceMode;count++}}catch(e){console.warn('skipped AI operation',o,e)}}backfillEntriesFromLibrary(state.foods,state.entries);const afterMissing=nutrientCoverage(state.entries).missing,fixed=Math.max(0,beforeMissing-afterMissing);save();closeModal();render();toast(`${count} change${count===1?'':'s'} applied${fixed?` · ${fixed} entr${fixed===1?'y':'ies'} completed`:''}`)};

function renderOnboard(){document.getElementById('step').textContent=step?`${step} / 5`:'';const r=document.getElementById('ocontent');if(step===0){r.innerHTML=`<div><h1 class="otitle">A small private record of your day.</h1><p class="ocopy">A few questions create a useful starting guide. Everything stays in this browser unless you choose to export or copy it.</p><div class="notice">No account, server, or AI API is required.</div><div class="oactions"><span></span><button class="btn-primary" onclick="nextStep()">continue</button></div></div>`;return}if(step===1){r.innerHTML=`<div><h1 class="otitle">A few basics.</h1><p class="ocopy">Age and the sex value below are used only by the resting-energy equation.</p><div class="stack"><label class="field"><span>age</span><input id="age" type="number" min="1" max="120" value="${draft.age??''}"></label><div class="choices">${['female','male','skip'].map(x=>`<label class="choice"><input type="radio" name="sex" value="${x}" ${x===(draft.sexForEquation||'skip')?'checked':''}><span>${x==='skip'?'skip automatic estimate':x}</span></label>`).join('')}</div><label class="choice"><input id="preg" type="checkbox" ${draft.pregnantBreastfeeding?'checked':''}><span><div>pregnant or breastfeeding</div><div class="tiny">Automatic calorie guidance will be disabled.</div></span></label></div>${buttons()}</div>`;return}if(step===2){const metric=draft.units==='metric',w=draft.weightLb?(metric?rnd(lbkg(draft.weightLb),1):rnd(draft.weightLb,1)):'',feet=draft.heightIn?Math.floor(draft.heightIn/12):'',inch=draft.heightIn?rnd(draft.heightIn%12,1):'',cm=draft.heightIn?rnd(incm(draft.heightIn),1):'';r.innerHTML=`<div><h1 class="otitle">Your current baseline.</h1><p class="ocopy">These values personalize the starting estimate.</p><div class="seg" style="margin-bottom:15px"><button class="${metric?'':'active'}" onclick="switchUnits('imperial')">US</button><button class="${metric?'active':''}" onclick="switchUnits('metric')">metric</button></div>${metric?`<div class="two"><label class="field"><span>height - cm</span><input id="hcm" type="number" step=".1" value="${cm}"></label><label class="field"><span>current - kg</span><input id="weight" type="number" step=".1" value="${w}"></label></div>`:`<div class="three"><label class="field"><span>height - ft</span><input id="hft" type="number" value="${feet}"></label><label class="field"><span>height - in</span><input id="hin" type="number" step=".1" value="${inch}"></label><label class="field"><span>current - lb</span><input id="weight" type="number" step=".1" value="${w}"></label></div>`}${buttons()}</div>`;return}if(step===3){r.innerHTML=`<div><h1 class="otitle">What does an ordinary week feel like?</h1><p class="ocopy">Pick the closest overall pattern, not your best day.</p><div class="choices">${ACT.map(a=>`<label class="choice"><input type="radio" name="activity" value="${a.v}" ${Number(draft.activityPAL)===a.v?'checked':''}><span><div>${esc(a.n)}</div><div class="tiny">${esc(a.d)}</div></span></label>`).join('')}</div>${buttons()}</div>`;return}if(step===4){const metric=draft.units==='metric',gv=draft.goalWeightLb?(metric?rnd(lbkg(draft.goalWeightLb),1):rnd(draft.goalWeightLb,1)):'';r.innerHTML=`<div><h1 class="otitle">Where are you trying to go?</h1><p class="ocopy">Once you enter a destination, the app uses the information you already gave it to suggest three starting plans.</p><div class="choices" style="margin-bottom:15px">${[['lose','move down'],['maintain','stay around here'],['gain','move up']].map(([v,l])=>`<label class="choice"><input type="radio" name="goaltype" value="${v}" onchange="goalTypeChanged('${v}')" ${draft.goalType===v?'checked':''}><span>${l}</span></label>`).join('')}</div>${draft.goalType==='maintain'?`<div class="notice">No pace choice is needed. The starting guide will use your estimated maintenance value.</div>`:`<label class="field"><span>destination - ${metric?'kg':'lb'}</span><input id="goalweight" type="number" step=".1" value="${gv}" placeholder="${metric?'72':'160'}" oninput="goalWeightChanged()"></label><div id="paces">${paceHTML()}</div>`}${buttons()}</div>`;return}if(step===5){const g=guidance(draft),opt=paceOptions(draft).find(x=>x.id===draft.paceMode),nt=g.ok?automaticNutritionTargets(g.target,draft):null;r.innerHTML=`<div><h1 class="otitle">A starting point.</h1><p class="ocopy">Your energy target and nutrition guide are calculated together from the information you already gave the app.</p>${g.ok?`<div class="planbox"><div class="tiny">initial daily energy guide</div><div><span class="planbig">${fmt(g.target)}</span><span class="planunit"> kcal / day</span></div>${nt?`<div class="onboard-nutrition">${goalCard('protein',0,nt.proteinG,'protein','minimum')}${goalCard('carbs',0,nt.carbsG,'carbs')}${goalCard('fat',0,nt.fatG,'fat')}${goalCard('fiber',0,nt.fiberG,'fiber','minimum')}</div>`:''}<div class="divider"></div><div class="stack"><div class="between"><span class="tiny">estimated maintenance now</span><span class="small">${fmt(g.maint)} kcal</span></div>${draft.goalType!=='maintain'?`<div class="between"><span class="tiny">pace</span><span class="small">${esc(opt?.name||draft.paceMode)} · about ${fmt(g.rate,2)} lb/week initially</span></div>`:''}${g.weeks?`<div class="between"><span class="tiny">rough time to destination</span><span class="small">${fmt(g.weeks,0)} weeks</span></div><div class="between"><span class="tiny">rough date</span><span class="small">${sdate(g.date)}</span></div>`:''}</div>${nt?`<div class="nutrition-method">Protein: ${fmt(nt.proteinG)} g/day (${esc(nt.proteinBasis)}). Fat: about 30% of the energy guide. Carbs: remaining planned energy. Fiber: about ${fmt(nt.fiberG)} g/day. These are starting guides, not hard limits.</div>`:''}</div>${g.floor?`<div class="notice warn" style="margin-top:12px">The selected pace would fall below the prototype's 1,000 kcal/day floor, so the target was limited. The actual pace would likely be slower.</div>`:''}<div class="notice" style="margin-top:12px">Real energy needs and weight change vary, and maintenance needs usually change as body weight changes. Review the plan against your actual trend.</div>`:`<div class="notice warn">${esc(g.reason||'Automatic guidance is unavailable.')}</div>`}<div class="oactions"><button class="btn" onclick="prevStep()">back</button>${g.reason&&g.reason.includes('BMI screening')?'':`<button class="btn-primary" onclick="finishSetup()">enter daybook</button>`}</div></div>`;return}}
function paceHTML(){const opts=paceOptions(draft);if(!draft.goalWeightLb)return `<div class="notice" style="margin-top:12px">Enter a destination to see suggested pace options.</div>`;if(!opts.length)return `<div class="notice warn" style="margin-top:12px">I cannot calculate pace options from the current baseline.</div>`;const recommendedId=suggestedMode(draft)||opts[0].id;if(!opts.some(x=>x.id===draft.paceMode)){draft.paceMode=recommendedId;draft.rateLbWeek=opts.find(x=>x.id===draft.paceMode)?.rate||opts[0].rate}return `<div class="pace-intro"><div><div class="small">Choose a pace</div><div class="tiny">Each card also shows the nutrition guide that pace would create.</div></div></div><div class="pace-grid">${opts.map(o=>{const nt=automaticNutritionTargets(o.target,draft);return `<button type="button" class="pace ${draft.paceMode===o.id?'selected':''} ${o.id===recommendedId?'recommended':''}" onclick="choosePace('${o.id}')"><div class="pace-name">${o.name}</div><div class="pace-sub">${o.note}</div><div class="pace-target">${fmt(o.target)} <span>kcal/day</span></div>${nt?`<div class="pace-nutrition"><span><strong>${fmt(nt.proteinG)}</strong>g protein</span><span><strong>${fmt(nt.carbsG)}</strong>g carbs</span><span><strong>${fmt(nt.fatG)}</strong>g fat</span><span><strong>${fmt(nt.fiberG)}</strong>g fiber</span></div>`:''}<div class="pace-meta"><div><div class="k">initial pace</div><div class="v">${fmt(o.rate,2)} lb/week</div></div><div><div class="k">rough time</div><div class="v">${o.weeks?fmt(o.weeks,0)+' weeks':'-'}</div></div><div><div class="k">rough date</div><div class="v">${o.date?sdate(o.date):'-'}</div></div><div><div class="k">change</div><div class="v">${draft.goalWeightLb?fmt(Math.abs(draft.weightLb-draft.goalWeightLb),1)+' lb':'-'}</div></div></div>${o.limited?`<div class="tiny" style="margin-top:8px;color:var(--warn)">limited by 1,000 kcal/day floor</div>`:''}</button>`}).join('')}</div><div class="tiny" style="margin-top:10px;line-height:1.55">These are starting estimates. Protein is automatically kept toward the higher end of the current 1.2–1.6 g/kg federal guidance during intentional weight change; the app can be customized later.</div>`}
window.goalWeightChanged=()=>{let x=nn(document.getElementById('goalweight')?.value);if(x&&draft.units==='metric')x=kglb(x);draft.goalWeightLb=x;if(!paceTouched){const rec=suggestedMode(draft);if(rec){draft.paceMode=rec;const o=paceOptions(draft).find(y=>y.id===rec);if(o)draft.rateLbWeek=o.rate}}const box=document.getElementById('paces');if(box)box.innerHTML=paceHTML()};window.choosePace=(id)=>{const o=paceOptions(draft).find(x=>x.id===id);if(!o)return;paceTouched=true;draft.paceMode=id;draft.rateLbWeek=o.rate;document.getElementById('paces').innerHTML=paceHTML()};window.goalTypeChanged=(v)=>{collect(false);draft.goalType=v;paceTouched=false;if(v==='maintain'){draft.goalWeightLb=draft.weightLb;draft.rateLbWeek=0;draft.paceMode='steady'}else{if(v==='lose'&&draft.goalWeightLb>=draft.weightLb)draft.goalWeightLb=null;if(v==='gain'&&draft.goalWeightLb<=draft.weightLb)draft.goalWeightLb=null;draft.paceMode='steady'}renderOnboard()};window.switchUnits=(u)=>{collect(false);draft.units=u;renderOnboard()};
window.nextStep=()=>{if(step>0&&!collect(true))return;step=Math.min(5,step+1);renderOnboard()};window.prevStep=()=>{if(step>0)collect(false);step=Math.max(0,step-1);renderOnboard()};
function collect(validate){if(step===1){const age=nn(document.getElementById('age')?.value),sex=document.querySelector('input[name="sex"]:checked')?.value;if(validate&&(!age||age<1||age>120)){toast('enter your age');return false}draft.age=age;draft.sexForEquation=['male','female'].includes(sex)?sex:null;draft.pregnantBreastfeeding=!!document.getElementById('preg')?.checked}if(step===2){let h,w=nn(document.getElementById('weight')?.value);if(draft.units==='metric'){const cm=nn(document.getElementById('hcm')?.value);h=cm?cmin(cm):null;if(w)w=kglb(w)}else{const ft=nn(document.getElementById('hft')?.value),inch=nn(document.getElementById('hin')?.value)||0;h=ft?ft*12+inch:null}if(validate&&(!h||!w)){toast('enter a valid height and current value');return false}draft.heightIn=h;draft.weightLb=w}if(step===3){const a=nn(document.querySelector('input[name="activity"]:checked')?.value);if(validate&&!a){toast('choose the closest activity pattern');return false}if(a)draft.activityPAL=a}if(step===4){const gt=document.querySelector('input[name="goaltype"]:checked')?.value;if(gt)draft.goalType=gt;if(gt==='maintain'){draft.goalWeightLb=draft.weightLb;draft.rateLbWeek=0;return true}let gw=nn(document.getElementById('goalweight')?.value);if(gw&&draft.units==='metric')gw=kglb(gw);if(validate&&!gw){toast('enter a destination');return false}draft.goalWeightLb=gw;if(validate&&gt==='lose'&&gw>=draft.weightLb){toast('choose a lower destination');return false}if(validate&&gt==='gain'&&gw<=draft.weightLb){toast('choose a higher destination');return false}const opts=paceOptions(draft);let chosen=opts.find(x=>x.id===draft.paceMode);if(!chosen){draft.paceMode=suggestedMode(draft);chosen=opts.find(x=>x.id===draft.paceMode)}if(chosen)draft.rateLbWeek=chosen.rate}return true}
window.finishSetup=()=>{const g=guidance(draft);if(g.reason&&g.reason.includes('BMI screening')){toast('change the destination first');return}state.profile={...draft,onboardingComplete:true,manualDailyGuide:state.profile.manualDailyGuide??null,nutritionPlanMode:state.profile.nutritionPlanMode||'auto',customNutritionTargets:state.profile.customNutritionTargets||null};if(!state.weights.length&&draft.weightLb)state.weights.push({id:uid('weight'),date:iso(),weightLb:draft.weightLb,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});save();closeOnboard();view='day';render();toast('saved locally')};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modalback').classList.contains('show'))closeModal()});render();if(!state.profile.onboardingComplete)start(false);
})();
</script>
